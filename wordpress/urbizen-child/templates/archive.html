  ARCHIVE DE CATÉGORIE — POURQUOI CE GABARIT EXISTE ALORS QU'ELLE EST EN NOINDEX

  Les trois catégories restent en `noindex` tant qu'elles n'ont pas assez de
  contenu : les moteurs ne les listeront donc pas. Mais un `noindex` n'est pas
  un mur — un visiteur qui suit le libellé de catégorie d'un guide arrive bien
  sur cette URL. Sans ce gabarit, il y verrait le thème Hostinger : un autre
  en-tête, un autre pied de page, et un titre en anglais.

  Le titre vient d'ici plutôt que d'un bloc `core/query-title` : le rendu de ce
  dernier dépend d'attributs et d'un préfixe (« Catégorie : ») que l'on aurait
  dû masquer ensuite. Le nom du terme est écrit par le pattern.
