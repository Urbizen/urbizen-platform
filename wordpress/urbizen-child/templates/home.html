<!--
  LE H1 EST ÉCRIT ICI, PAS HÉRITÉ DE LA PAGE.

  Sur `home.html`, WordPress interroge la liste des articles ; l'objet
  interrogé n'est pas la page assignée à `page_for_posts`. Un bloc
  `core/post-title` y rend donc, selon le contexte, le titre du PREMIER
  ARTICLE de la liste, ou rien du tout — et sur une page 2 de pagination, un
  titre encore différent. Le titre de la page n'est pas non plus une donnée
  qu'un gabarit `.html` puisse aller chercher, faute de pouvoir exécuter du
  PHP.

  Le libellé est donc en dur. C'est le choix sûr : la page WordPress
  « Guides d'urbanisme » sert à porter le slug `/guides/` et les métadonnées
  AIOSEO ; le titre affiché, lui, est ici et ne dépend d'aucun mécanisme
  incertain.
-->
