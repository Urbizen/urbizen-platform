<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560"
     role="img" aria-labelledby="t-dp4 d-dp4" font-family="IBM Plex Sans, system-ui, sans-serif">
  <title id="t-dp4">Façades et toitures</title>
  <desc id="d-dp4">Extrait de plan de façades : trois élévations, dont la partie créée figurée en vert, et la liste des matériaux et teintes portés au dossier. Projet fictif.</desc>
  <rect width="760" height="560" fill="#FBFCFD"/>
  <rect x="14" y="14" width="732" height="532" fill="none" stroke="#9FADBC" stroke-width="1"/>
  <rect x="22" y="22" width="716" height="516" fill="none" stroke="#C9D3DD" stroke-width=".8"/>
  <text x="46" y="60" fill="#55617A" font-size="11.5">Façade sud — état projeté</text>
  <rect x="60" y="90" width="300" height="190" fill="#EAEEF2" stroke="#14233B" stroke-width="2"/>
  <path d="M48 90 L210 20 L372 90 Z" fill="#EAEEF2" stroke="#14233B" stroke-width="2"/>
  <g fill="#FBFCFD" stroke="#14233B" stroke-width="1.4">
    <rect x="92" y="130" width="52" height="66"/><rect x="176" y="130" width="52" height="66"/><rect x="260" y="130" width="52" height="66"/>
    <rect x="176" y="216" width="52" height="64"/>
  </g>
  <text x="46" y="330" fill="#55617A" font-size="11.5">Façade est — état projeté</text>
  <rect x="60" y="352" width="220" height="118" fill="#EAEEF2" stroke="#14233B" stroke-width="2"/>
  <path d="M50 352 L170 306 L290 352 Z" fill="#EAEEF2" stroke="#14233B" stroke-width="2"/>
  <g fill="#FBFCFD" stroke="#14233B" stroke-width="1.4"><rect x="94" y="386" width="46" height="58"/><rect x="196" y="386" width="46" height="58"/></g>
  <rect x="420" y="90" width="290" height="190" fill="#E4F5EC" stroke="#128A5A" stroke-width="2.5"/>
  <path d="M408 90 L565 24 L722 90 Z" fill="#E4F5EC" stroke="#128A5A" stroke-width="2.5"/>
  <text x="565" y="196" text-anchor="middle" fill="#0E6E48" font-size="13" font-weight="600">Partie créée</text>
  <text x="418" y="60" fill="#0E6E48" font-size="11.5">Façade ouest — projet</text>
  <g transform="translate(420,330)" font-size="11">
    <text fill="#55617A" y="0">Matériaux et teintes portés au dossier :</text>
    <text fill="#14233B" y="24">— enduit ton pierre</text>
    <text fill="#14233B" y="44">— menuiseries gris anthracite</text>
    <text fill="#14233B" y="64">— tuiles terre cuite</text>
  </g>
  <!-- cartouche -->
  <g transform="translate(22,490)">
    <rect x="0" y="0" width="716" height="48" fill="#EAEEF2" stroke="#C9D3DD" stroke-width=".8"/>
    <text x="14" y="20" fill="#128A5A" font-family="IBM Plex Mono, monospace" font-size="10.5" letter-spacing="1.2">DP4 · PCMI5</text>
    <text x="14" y="37" fill="#14233B" font-size="13" font-weight="600">Façades et toitures</text>
    <text x="702" y="20" text-anchor="end" fill="#8791A6" font-family="IBM Plex Mono, monospace" font-size="9.5">EXEMPLE URBIZEN</text>
    <text x="702" y="37" text-anchor="end" fill="#8791A6" font-size="10.5">Illustration — projet fictif</text>
  </g>
</svg>
