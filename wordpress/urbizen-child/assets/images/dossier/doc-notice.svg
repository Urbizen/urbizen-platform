<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560"
     role="img" aria-labelledby="t-notice d-notice" font-family="IBM Plex Sans, system-ui, sans-serif">
  <title id="t-notice">Notice descriptive</title>
  <desc id="d-notice">Extrait schématique d'une notice descriptive : cinq rubriques — terrain, état initial, implantation, accès, matériaux — et un encadré rappelant qu'elle n'est pas toujours requise pour une déclaration préalable. Aucune donnée réelle.</desc>
  <rect width="760" height="560" fill="#EAEEF2"/>
  <rect x="70" y="26" width="620" height="508" fill="#FBFCFD" stroke="#C9D3DD" stroke-width="1"
        rx="2"/>
  <text x="104" y="76" fill="#14233B" font-size="15" font-weight="600">Notice descriptive</text>
  <text x="104" y="98" fill="#55617A" font-size="11.5">Le texte qui accompagne les plans et explique le projet</text>
  <path d="M104 110H656" stroke="#C9D3DD" stroke-width="1"/>
  <text x="110" y="132" fill="#14233B" font-size="12.5" font-weight="600">Terrain et son environnement</text>
  <rect x="110" y="150" width="500" height="6" rx="3" fill="#C9D3DD" opacity=".55"/>
  <rect x="110" y="166" width="453" height="6" rx="3" fill="#C9D3DD" opacity=".55"/>
  <rect x="110" y="182" width="406" height="6" rx="3" fill="#C9D3DD" opacity=".55"/>
  <text x="110" y="216" fill="#14233B" font-size="12.5" font-weight="600">État initial</text>
  <rect x="110" y="234" width="500" height="6" rx="3" fill="#C9D3DD" opacity=".55"/>
  <rect x="110" y="250" width="453" height="6" rx="3" fill="#C9D3DD" opacity=".55"/>
  <text x="110" y="284" fill="#14233B" font-size="12.5" font-weight="600">Implantation du projet</text>
  <rect x="110" y="302" width="500" height="6" rx="3" fill="#C9D3DD" opacity=".55"/>
  <rect x="110" y="318" width="453" height="6" rx="3" fill="#C9D3DD" opacity=".55"/>
  <rect x="110" y="334" width="406" height="6" rx="3" fill="#C9D3DD" opacity=".55"/>
  <text x="110" y="368" fill="#14233B" font-size="12.5" font-weight="600">Traitement des accès et abords</text>
  <rect x="110" y="386" width="500" height="6" rx="3" fill="#C9D3DD" opacity=".55"/>
  <rect x="110" y="402" width="453" height="6" rx="3" fill="#C9D3DD" opacity=".55"/>
  <text x="110" y="436" fill="#14233B" font-size="12.5" font-weight="600">Matériaux et couleurs</text>
  <rect x="110" y="454" width="500" height="6" rx="3" fill="#C9D3DD" opacity=".55"/>
  <rect x="110" y="470" width="453" height="6" rx="3" fill="#C9D3DD" opacity=".55"/>
  <rect x="110" y="486" width="406" height="6" rx="3" fill="#C9D3DD" opacity=".55"/>
  <rect x="104" y="470" width="552" height="42" fill="#E4F5EC" stroke="#128A5A" stroke-width="1.2" rx="6"/>
  <text x="120" y="488" fill="#0E6E48" font-size="11.5">Exigée pour un permis de construire, la notice n'est pas toujours</text>
  <text x="120" y="504" fill="#0E6E48" font-size="11.5">requise pour une déclaration préalable.</text>
  <g transform="translate(70,516)">
    <text x="0" y="12" fill="#128A5A" font-family="IBM Plex Mono, monospace" font-size="10.5" letter-spacing="1.2">PCMI4</text>
    <text x="620" y="12" text-anchor="end" fill="#8791A6" font-family="IBM Plex Mono, monospace" font-size="9.5">EXEMPLE URBIZEN</text><text x="620" y="26" text-anchor="end" fill="#8791A6" font-size="10.5">Illustration — projet fictif</text>
  </g>
</svg>
