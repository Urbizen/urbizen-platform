<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 700" width="840" height="700" role="img"
     aria-labelledby="tdp ddp" font-family="IBM Plex Sans, system-ui, sans-serif">
  <title id="tdp">Arbre de décision : déclaration préalable ou permis de construire</title>
  <desc id="ddp">La première question est de savoir si le projet est une construction nouvelle ou
  des travaux sur une construction existante. Pour une construction nouvelle : jusqu'à 5 mètres
  carrés d'emprise au sol et de surface de plancher, aucune formalité ; dès que l'une des deux
  dépasse 5 mètres carrés et jusqu'à 20, déclaration préalable ; au-delà de 20 mètres carrés,
  permis de construire. Pour des travaux sur une construction existante : jusqu'à 5 mètres carrés,
  aucune formalité ; de plus de 5 à 20 mètres carrés, déclaration préalable ; de 20 à 40 mètres
  carrés, permis de construire hors zone urbaine d'un plan local d'urbanisme, mais déclaration
  préalable en zone urbaine, sauf si la surface totale après travaux franchit 150 mètres carrés,
  auquel cas le permis redevient obligatoire ; au-delà de 40 mètres carrés, permis de construire.
  Un avertissement final rappelle que dans le périmètre d'un site patrimonial remarquable, aux
  abords d'un monument historique ou dans un site classé, les dispenses tombent et une déclaration
  préalable reste exigée même sous les seuils.</desc>

  <rect width="840" height="700" fill="#FBFCFD"/>
  <g stroke="#C9D3DD" stroke-width=".5" opacity=".55">
    <path d="M40 0V700M120 0V700M200 0V700M280 0V700M360 0V700M440 0V700M520 0V700M600 0V700M680 0V700M760 0V700"/>
    <path d="M0 40H840M0 120H840M0 200H840M0 280H840M0 360H840M0 440H840M0 520H840M0 600H840M0 680H840"/>
  </g>

  <text x="40" y="42" fill="#14233B" font-size="19" font-weight="600">Quelle formalité pour votre projet ?</text>
  <text x="40" y="65" fill="#55617A" font-size="13.5">Les seuils ne se lisent pas de la même façon des deux côtés de la première question</text>

  <!-- Question 1 -->
  <rect x="230" y="86" width="380" height="52" rx="8" fill="#14233B"/>
  <text x="420" y="110" text-anchor="middle" fill="#FBFCFD" font-size="12" letter-spacing=".8">QUESTION 1</text>
  <text x="420" y="129" text-anchor="middle" fill="#FBFCFD" font-size="14.5" font-weight="600">Le projet touche-t-il la construction existante ?</text>

  <!-- connecteurs -->
  <g stroke="#55617A" stroke-width="1.6" fill="none">
    <path d="M420 138V160M220 160H620M220 160V186M620 160V186"/>
  </g>

  <!-- ================= COLONNE GAUCHE — construction nouvelle ================= -->
  <rect x="40" y="186" width="360" height="46" rx="8" fill="#EAEEF2" stroke="#9FADBC" stroke-width="1.5"/>
  <text x="220" y="206" text-anchor="middle" fill="#14233B" font-size="13" font-weight="600">NON — construction nouvelle</text>
  <text x="220" y="223" text-anchor="middle" fill="#55617A" font-size="12">articles R.421-2 et R.421-9</text>

  <!-- ligne A -->
  <rect x="40" y="248" width="360" height="52" rx="8" fill="#EAEEF2" stroke="#9FADBC" stroke-width="1.5"/>
  <text x="58" y="270" fill="#14233B" font-size="13">Emprise <tspan font-weight="600">et</tspan> surface de plancher ≤ 5 m²</text>
  <text x="58" y="290" fill="#55617A" font-size="14" font-weight="600">Aucune formalité</text>

  <!-- ligne B -->
  <rect x="40" y="310" width="360" height="52" rx="8" fill="#E4F5EC" stroke="#128A5A" stroke-width="2"/>
  <text x="58" y="332" fill="#14233B" font-size="13"><tspan font-weight="600">L'une des deux</tspan> &gt; 5 m², jusqu'à 20 m²</text>
  <text x="58" y="352" fill="#0E6E48" font-size="14" font-weight="600">Déclaration préalable</text>

  <!-- ligne C -->
  <rect x="40" y="372" width="360" height="52" rx="8" fill="#FBFCFD" stroke="#14233B" stroke-width="2.5"/>
  <text x="58" y="394" fill="#14233B" font-size="13">Plus de 20 m²</text>
  <text x="58" y="414" fill="#14233B" font-size="14" font-weight="600">Permis de construire</text>

  <rect x="40" y="436" width="360" height="40" rx="8" fill="#FBFCFD" stroke="#C9D3DD" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="220" y="461" text-anchor="middle" fill="#55617A" font-size="12.5">La zone du PLU ne relève aucun seuil ici</text>

  <!-- ================= COLONNE DROITE — travaux sur l'existant ================= -->
  <rect x="440" y="186" width="360" height="46" rx="8" fill="#EAEEF2" stroke="#9FADBC" stroke-width="1.5"/>
  <text x="620" y="206" text-anchor="middle" fill="#14233B" font-size="13" font-weight="600">OUI — travaux sur l'existant</text>
  <text x="620" y="223" text-anchor="middle" fill="#55617A" font-size="12">articles R.421-14 et R.421-17</text>

  <!-- ligne A -->
  <rect x="440" y="248" width="360" height="52" rx="8" fill="#EAEEF2" stroke="#9FADBC" stroke-width="1.5"/>
  <text x="458" y="270" fill="#14233B" font-size="13">Emprise <tspan font-weight="600">et</tspan> surface de plancher ≤ 5 m²</text>
  <text x="458" y="290" fill="#55617A" font-size="14" font-weight="600">Aucune formalité</text>

  <!-- ligne B -->
  <rect x="440" y="310" width="360" height="52" rx="8" fill="#E4F5EC" stroke="#128A5A" stroke-width="2"/>
  <text x="458" y="332" fill="#14233B" font-size="13">Plus de 5 m², jusqu'à 20 m²</text>
  <text x="458" y="352" fill="#0E6E48" font-size="14" font-weight="600">Déclaration préalable</text>

  <!-- ligne C — la case à deux réponses -->
  <rect x="440" y="372" width="360" height="104" rx="8" fill="#FBFCFD" stroke="#128A5A" stroke-width="2" stroke-dasharray="9 5"/>
  <text x="458" y="394" fill="#14233B" font-size="13" font-weight="600">De 20 à 40 m² — la seule case à deux réponses</text>
  <line x1="458" y1="404" x2="782" y2="404" stroke="#C9D3DD" stroke-width="1"/>
  <text x="458" y="424" fill="#55617A" font-size="12.5">Hors zone U d'un PLU</text>
  <text x="640" y="424" fill="#14233B" font-size="13" font-weight="600">Permis de construire</text>
  <text x="458" y="446" fill="#55617A" font-size="12.5">En zone U d'un PLU</text>
  <text x="640" y="446" fill="#0E6E48" font-size="13" font-weight="600">Déclaration préalable</text>
  <text x="458" y="466" fill="#14233B" font-size="12.5">… <tspan font-weight="600">sauf</tspan> si le total après travaux franchit 150 m² → permis</text>

  <!-- ligne D -->
  <rect x="440" y="486" width="360" height="52" rx="8" fill="#FBFCFD" stroke="#14233B" stroke-width="2.5"/>
  <text x="458" y="508" fill="#14233B" font-size="13">Plus de 40 m²</text>
  <text x="458" y="528" fill="#14233B" font-size="14" font-weight="600">Permis de construire</text>

  <!-- ================= bandeau périmètres protégés ================= -->
  <rect x="40" y="562" width="760" height="62" rx="8" fill="#E4F5EC" stroke="#128A5A" stroke-width="2"/>
  <circle cx="72" cy="593" r="13" fill="#128A5A"/>
  <text x="72" y="599" text-anchor="middle" fill="#FBFCFD" font-size="17" font-weight="600">!</text>
  <text x="98" y="588" fill="#0E6E48" font-size="13.5" font-weight="600">Site patrimonial remarquable, abords d'un monument historique, site classé</text>
  <text x="98" y="609" fill="#14233B" font-size="13">Les dispenses tombent : une déclaration préalable reste exigée sous les seuils (art. R.421-11).</text>

  <!-- légende -->
  <g transform="translate(40,660)" font-size="12.5">
    <rect x="0" y="-11" width="18" height="14" rx="2" fill="#EAEEF2" stroke="#9FADBC" stroke-width="1.5"/>
    <text x="26" y="0" fill="#55617A">Aucune formalité</text>
    <rect x="180" y="-11" width="18" height="14" rx="2" fill="#E4F5EC" stroke="#128A5A" stroke-width="2"/>
    <text x="206" y="0" fill="#14233B">Déclaration préalable</text>
    <rect x="386" y="-11" width="18" height="14" rx="2" fill="#FBFCFD" stroke="#14233B" stroke-width="2.5"/>
    <text x="412" y="0" fill="#14233B">Permis de construire</text>
    <text x="596" y="0" fill="#55617A">Seuils nationaux — le PLU peut restreindre</text>
  </g>
</svg>
