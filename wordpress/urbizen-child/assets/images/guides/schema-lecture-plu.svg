<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img"
     aria-labelledby="tplu dplu" font-family="IBM Plex Sans, system-ui, sans-serif">
  <title id="tplu">Les six familles de règles qu'un règlement de zone peut fixer</title>
  <desc id="dplu">Coupe d'une parcelle fictive, de la voie publique à gauche jusqu'à la limite
  séparative à droite. Six règles y sont repérées. Un : le recul minimal par rapport à
  l'alignement de la voie publique. Deux : l'emprise au sol maximale, exprimée en pourcentage de
  la surface de la parcelle et calculée sur l'ensemble du bâti, existant compris. Trois : la
  hauteur maximale, mesurée depuis un point de référence que le règlement définit, ici le terrain
  naturel jusqu'à l'égout du toit. Quatre : les règles d'aspect extérieur, portant sur la pente de
  toiture, les matériaux, les teintes et les proportions des ouvertures. Cinq : la distance
  minimale à respecter par rapport à la limite séparative. Six : la part d'espaces verts de pleine
  terre à conserver. Un avertissement rappelle qu'aucune commune n'emploie ces six règles de la
  même façon, et que les valeurs figurant sur le schéma sont inventées pour l'exemple.</desc>

  <defs>
    <pattern id="pv" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#128A5A" stroke-width="1.4" opacity=".5"/>
    </pattern>
    <marker id="fl" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0.5L8 4.5L0 8.5z" fill="#55617A"/>
    </marker>
    <marker id="fr" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M9 0.5L1 4.5L9 8.5z" fill="#55617A"/>
    </marker>
  </defs>

  <rect width="840" height="560" fill="#FBFCFD"/>
  <g stroke="#C9D3DD" stroke-width=".5" opacity=".55">
    <path d="M40 0V560M120 0V560M200 0V560M280 0V560M360 0V560M440 0V560M520 0V560M600 0V560M680 0V560M760 0V560"/>
    <path d="M0 40H840M0 120H840M0 200H840M0 280H840M0 360H840M0 440H840M0 520H840"/>
  </g>

  <text x="40" y="42" fill="#14233B" font-size="19" font-weight="600">Ce qu'un règlement de zone peut fixer</text>
  <text x="40" y="65" fill="#55617A" font-size="13.5">Coupe d'une parcelle — valeurs inventées pour l'exemple</text>

  <!-- parcelle -->
  <rect x="140" y="110" width="640" height="270" fill="#F2F5F8"/>
  <!-- voie publique -->
  <rect x="0" y="380" width="140" height="26" fill="#EAEEF2" stroke="#9FADBC" stroke-width="1.5"/>
  <text x="70" y="398" text-anchor="middle" fill="#55617A" font-size="11.5">voie publique</text>

  <!-- limites verticales -->
  <line x1="140" y1="108" x2="140" y2="406" stroke="#14233B" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="146" y="124" fill="#14233B" font-size="11.5">alignement</text>
  <line x1="780" y1="108" x2="780" y2="406" stroke="#14233B" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="774" y="124" text-anchor="end" fill="#14233B" font-size="11.5">limite séparative</text>

  <!-- sol -->
  <line x1="140" y1="380" x2="780" y2="380" stroke="#14233B" stroke-width="2.5"/>
  <text x="150" y="396" fill="#55617A" font-size="11.5">terrain naturel</text>

  <!-- espaces verts (6) -->
  <rect x="600" y="356" width="176" height="24" fill="url(#pv)" stroke="#128A5A" stroke-width="1.5"/>
  <rect x="600" y="356" width="176" height="24" fill="#E4F5EC" opacity=".3"/>

  <!-- maison -->
  <rect x="280" y="250" width="300" height="130" fill="#FBFCFD" stroke="#14233B" stroke-width="2.5"/>
  <path d="M266 250L430 188L594 250z" fill="#EAEEF2" stroke="#14233B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- ouvertures -->
  <g fill="#EAEEF2" stroke="#55617A" stroke-width="1.5">
    <rect x="316" y="288" width="40" height="60" rx="2"/>
    <rect x="410" y="288" width="40" height="60" rx="2"/>
    <rect x="504" y="288" width="40" height="60" rx="2"/>
  </g>

  <!-- 1 · recul -->
  <line x1="140" y1="336" x2="280" y2="336" stroke="#55617A" stroke-width="1.5" marker-start="url(#fr)" marker-end="url(#fl)"/>
  <text x="210" y="329" text-anchor="middle" fill="#14233B" font-size="12.5" font-weight="600">recul ≥ 5 m</text>
  <circle cx="210" cy="352" r="11" fill="#128A5A"/>
  <text x="210" y="357" text-anchor="middle" fill="#FBFCFD" font-size="12.5" font-weight="600">1</text>

  <!-- 5 · distance limite -->
  <line x1="580" y1="336" x2="780" y2="336" stroke="#55617A" stroke-width="1.5" marker-start="url(#fr)" marker-end="url(#fl)"/>
  <text x="680" y="329" text-anchor="middle" fill="#14233B" font-size="12.5" font-weight="600">retrait ≥ 3 m</text>
  <circle cx="680" cy="352" r="11" fill="#128A5A"/>
  <text x="680" y="357" text-anchor="middle" fill="#FBFCFD" font-size="12.5" font-weight="600">5</text>

  <!-- 3 · hauteur -->
  <line x1="252" y1="380" x2="252" y2="250" stroke="#55617A" stroke-width="1.5" marker-start="url(#fr)" marker-end="url(#fl)"/>
  <circle cx="252" cy="315" r="11" fill="#128A5A"/>
  <text x="252" y="320" text-anchor="middle" fill="#FBFCFD" font-size="12.5" font-weight="600">3</text>
  <text x="234" y="240" text-anchor="end" fill="#14233B" font-size="12.5" font-weight="600">hauteur</text>
  <text x="234" y="256" text-anchor="end" fill="#55617A" font-size="11.5">à l'égout : 6,50 m</text>
  <line x1="238" y1="250" x2="280" y2="250" stroke="#9FADBC" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- 4 · aspect -->
  <circle cx="430" cy="216" r="11" fill="#128A5A"/>
  <text x="430" y="221" text-anchor="middle" fill="#FBFCFD" font-size="12.5" font-weight="600">4</text>
  <line x1="446" y1="210" x2="618" y2="176" stroke="#9FADBC" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="624" y="172" fill="#14233B" font-size="12.5" font-weight="600">pente 35 – 45 %</text>
  <text x="624" y="188" fill="#55617A" font-size="11.5">matériaux, teintes,</text>
  <text x="624" y="203" fill="#55617A" font-size="11.5">proportions des ouvertures</text>

  <!-- 2 · emprise -->
  <path d="M280 414V424H580V414" fill="none" stroke="#128A5A" stroke-width="2"/>
  <circle cx="430" cy="440" r="11" fill="#128A5A"/>
  <text x="430" y="445" text-anchor="middle" fill="#FBFCFD" font-size="12.5" font-weight="600">2</text>
  <text x="452" y="445" fill="#14233B" font-size="12.5" font-weight="600">emprise au sol ≤ 35 % de la parcelle</text>
  <text x="452" y="461" fill="#55617A" font-size="11.5">calculée sur tout le bâti, existant compris</text>

  <!-- 6 · espaces verts
       Le libellé passe À DROITE du repère, sur la même ligne : posé en dessous
       et aligné à droite, il chevauchait la seconde ligne du repère 2. -->
  <circle cx="696" cy="440" r="11" fill="#128A5A"/>
  <text x="696" y="445" text-anchor="middle" fill="#FBFCFD" font-size="12.5" font-weight="600">6</text>
  <line x1="696" y1="429" x2="696" y2="384" stroke="#9FADBC" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="714" y="445" fill="#14233B" font-size="12" font-weight="600">pleine terre ≥ 25 %</text>

  <!-- avertissement -->
  <rect x="40" y="488" width="760" height="48" rx="8" fill="#E4F5EC" stroke="#128A5A" stroke-width="1.5"/>
  <text x="60" y="509" fill="#0E6E48" font-size="12.5" font-weight="600">Aucune commune n'emploie ces six règles de la même façon.</text>
  <text x="60" y="527" fill="#14233B" font-size="12.5">Le point depuis lequel se mesure la hauteur, et la définition de la limite séparative, sont fixés par le règlement lui-même.</text>
</svg>
