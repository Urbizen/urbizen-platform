<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="840" height="580" role="img"
     aria-labelledby="tchr dchr" font-family="IBM Plex Sans, system-ui, sans-serif">
  <title id="tchr">Chronologie d'une autorisation d'urbanisme, du projet au premier coup de pelle</title>
  <desc id="dchr">Six étapes se succèdent. Un : la préparation du dossier, de durée variable, qu'aucun
  texte n'encadre. Deux : le dépôt en mairie, qui fait partir le délai. Trois : l'instruction, d'un
  mois pour une déclaration préalable, de deux mois pour un permis portant sur une maison
  individuelle ou ses annexes, de trois mois pour les autres permis, majorée d'un mois en périmètre
  protégé. Quatre : la décision, expresse ou tacite, le silence gardé valant permis tacite ou
  non-opposition. Cinq : l'affichage sur le terrain, à poser dès la décision et à maintenir pendant
  tout le chantier. Six : les travaux, qui peuvent commencer dès que la décision est exécutoire.
  Une dérivation part de l'étape trois : si la mairie réclame des pièces manquantes dans le mois qui
  suit le dépôt, le demandeur a trois mois pour les produire, et le délai d'instruction recommence
  entièrement à leur réception — il ne reprend pas où il s'était arrêté. Deux délais courent ensuite
  en parallèle après la décision : le recours des tiers, de deux mois à compter du premier jour
  d'une période continue de deux mois d'affichage, et le retrait par l'administration, de trois mois
  à compter de la décision et seulement si celle-ci est illégale.</desc>

  <defs>
    <marker id="fx" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0.5L8 4.5L0 8.5z" fill="#9FADBC"/>
    </marker>
  </defs>

  <rect width="840" height="580" fill="#FBFCFD"/>
  <g stroke="#C9D3DD" stroke-width=".5" opacity=".55">
    <path d="M40 0V580M120 0V580M200 0V580M280 0V580M360 0V580M440 0V580M520 0V580M600 0V580M680 0V580M760 0V580"/>
    <path d="M0 40H840M0 120H840M0 200H840M0 280H840M0 360H840M0 440H840M0 520H840"/>
  </g>

  <text x="40" y="42" fill="#14233B" font-size="19" font-weight="600">Du projet au premier coup de pelle</text>
  <text x="40" y="65" fill="#55617A" font-size="13.5">Seules les étapes 3 et les délais du bas sont bornés par un texte</text>

  <!-- flèches de liaison -->
  <g stroke="#9FADBC" stroke-width="1.6" marker-end="url(#fx)">
    <line x1="158" y1="156" x2="166" y2="156"/>
    <line x1="286" y1="156" x2="294" y2="156"/>
    <line x1="414" y1="156" x2="422" y2="156"/>
    <line x1="542" y1="156" x2="550" y2="156"/>
    <line x1="670" y1="156" x2="678" y2="156"/>
  </g>

  <!-- 1 · préparation -->
  <rect x="40" y="106" width="118" height="100" rx="8" fill="#FBFCFD" stroke="#9FADBC" stroke-width="1.6" stroke-dasharray="6 4"/>
  <circle cx="60" cy="126" r="11" fill="#9FADBC"/><text x="60" y="131" text-anchor="middle" fill="#FBFCFD" font-size="12" font-weight="600">1</text>
  <text x="99" y="158" text-anchor="middle" fill="#14233B" font-size="12.5" font-weight="600">Préparation</text>
  <text x="99" y="174" text-anchor="middle" fill="#14233B" font-size="12.5" font-weight="600">du dossier</text>
  <text x="99" y="194" text-anchor="middle" fill="#55617A" font-size="11.5">durée variable</text>

  <!-- 2 · dépôt -->
  <rect x="168" y="106" width="118" height="100" rx="8" fill="#EAEEF2" stroke="#9FADBC" stroke-width="1.6"/>
  <circle cx="188" cy="126" r="11" fill="#55617A"/><text x="188" y="131" text-anchor="middle" fill="#FBFCFD" font-size="12" font-weight="600">2</text>
  <text x="227" y="158" text-anchor="middle" fill="#14233B" font-size="12.5" font-weight="600">Dépôt</text>
  <text x="227" y="174" text-anchor="middle" fill="#14233B" font-size="12.5" font-weight="600">en mairie</text>
  <text x="227" y="194" text-anchor="middle" fill="#55617A" font-size="11.5">le délai part</text>

  <!-- 3 · instruction -->
  <rect x="296" y="106" width="118" height="100" rx="8" fill="#E4F5EC" stroke="#128A5A" stroke-width="2.2"/>
  <circle cx="316" cy="126" r="11" fill="#128A5A"/><text x="316" y="131" text-anchor="middle" fill="#FBFCFD" font-size="12" font-weight="600">3</text>
  <text x="355" y="158" text-anchor="middle" fill="#0E6E48" font-size="12.5" font-weight="600">Instruction</text>
  <text x="355" y="176" text-anchor="middle" fill="#14233B" font-size="11.5">1, 2 ou 3 mois</text>
  <text x="355" y="192" text-anchor="middle" fill="#55617A" font-size="11">+1 mois si protégé</text>

  <!-- 4 · décision -->
  <rect x="424" y="106" width="118" height="100" rx="8" fill="#EAEEF2" stroke="#9FADBC" stroke-width="1.6"/>
  <circle cx="444" cy="126" r="11" fill="#55617A"/><text x="444" y="131" text-anchor="middle" fill="#FBFCFD" font-size="12" font-weight="600">4</text>
  <text x="483" y="158" text-anchor="middle" fill="#14233B" font-size="12.5" font-weight="600">Décision</text>
  <text x="483" y="176" text-anchor="middle" fill="#55617A" font-size="11.5">expresse</text>
  <text x="483" y="192" text-anchor="middle" fill="#55617A" font-size="11.5">ou tacite</text>

  <!-- 5 · affichage -->
  <rect x="552" y="106" width="118" height="100" rx="8" fill="#EAEEF2" stroke="#9FADBC" stroke-width="1.6"/>
  <circle cx="572" cy="126" r="11" fill="#55617A"/><text x="572" y="131" text-anchor="middle" fill="#FBFCFD" font-size="12" font-weight="600">5</text>
  <text x="611" y="158" text-anchor="middle" fill="#14233B" font-size="12.5" font-weight="600">Affichage</text>
  <text x="611" y="176" text-anchor="middle" fill="#55617A" font-size="11.5">dès la décision,</text>
  <text x="611" y="192" text-anchor="middle" fill="#55617A" font-size="11.5">tout le chantier</text>

  <!-- 6 · travaux -->
  <rect x="680" y="106" width="118" height="100" rx="8" fill="#FBFCFD" stroke="#14233B" stroke-width="2.5"/>
  <circle cx="700" cy="126" r="11" fill="#14233B"/><text x="700" y="131" text-anchor="middle" fill="#FBFCFD" font-size="12" font-weight="600">6</text>
  <text x="739" y="158" text-anchor="middle" fill="#14233B" font-size="12.5" font-weight="600">Travaux</text>
  <text x="739" y="176" text-anchor="middle" fill="#55617A" font-size="11.5">dès que la décision</text>
  <text x="739" y="192" text-anchor="middle" fill="#55617A" font-size="11.5">est exécutoire</text>

  <!-- dérivation pièces manquantes -->
  <path d="M355 206V236H236" fill="none" stroke="#128A5A" stroke-width="1.8" stroke-dasharray="6 4"/>
  <path d="M355 300V270" fill="none" stroke="#128A5A" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="72" y="252" width="640" height="72" rx="8" fill="#FBFCFD" stroke="#128A5A" stroke-width="2"/>
  <text x="92" y="276" fill="#0E6E48" font-size="13" font-weight="600">Si la mairie réclame des pièces manquantes</text>
  <text x="92" y="295" fill="#14233B" font-size="12.5">Demande dans le mois du dépôt, de façon exhaustive (R.423-38) · trois mois pour produire (R.423-39)</text>
  <text x="92" y="314" fill="#14233B" font-size="12.5">Le délai d'instruction <tspan font-weight="600">recommence entier</tspan> à la réception des pièces — il ne reprend pas où il s'était arrêté.</text>

  <!-- délais parallèles -->
  <text x="40" y="368" fill="#14233B" font-size="14" font-weight="600">Deux délais courent après la décision</text>

  <line x1="483" y1="382" x2="483" y2="396" stroke="#9FADBC" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="611" y1="382" x2="611" y2="450" stroke="#9FADBC" stroke-width="1.4" stroke-dasharray="4 3"/>

  <rect x="424" y="396" width="374" height="44" rx="6" fill="#EAEEF2" stroke="#9FADBC" stroke-width="1.6"/>
  <text x="440" y="415" fill="#14233B" font-size="12.5" font-weight="600">Retrait par l'administration — 3 mois</text>
  <text x="440" y="432" fill="#55617A" font-size="11.5">à compter de la décision, et seulement si elle est illégale (L.424-5)</text>

  <!-- Cadre élargi vers la gauche : à 246 px, la seconde ligne finissait à un
       pixel du bord et le mot « continu » venait mordre le filet. -->
  <rect x="498" y="450" width="300" height="44" rx="6" fill="#E4F5EC" stroke="#128A5A" stroke-width="2"/>
  <text x="514" y="469" fill="#0E6E48" font-size="12.5" font-weight="600">Recours des tiers — 2 mois</text>
  <text x="514" y="486" fill="#14233B" font-size="11.5">dès le 1er jour de 2 mois d'affichage <tspan font-weight="600">continu</tspan></text>

  <!-- note finale -->
  <rect x="40" y="512" width="758" height="48" rx="8" fill="#E4F5EC" stroke="#128A5A" stroke-width="1.5"/>
  <text x="60" y="533" fill="#0E6E48" font-size="12.5" font-weight="600">Les travaux ne sont pas suspendus à la fin du délai de recours.</text>
  <text x="60" y="551" fill="#14233B" font-size="12.5">Attendre relève de la prudence, pas d'une obligation : c'est un arbitrage qui vous appartient.</text>
</svg>
