<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="840" height="460" role="img"
     aria-labelledby="t2 d2" font-family="IBM Plex Sans, system-ui, sans-serif">
  <title id="t2">Garage de 19 m² dont une dalle sous auvent porte l'emprise à 23 m²</title>
  <desc id="d2">Le garage fermé mesure 19 m² d'emprise au sol ; sa surface de plancher est déduite s'il est aménagé pour le stationnement. L'auvent qui le prolonge est
  soutenu par des poteaux : sa dalle de 4 m² entre donc dans l'emprise au sol, qui atteint
  23 m². Le projet dépasse 20 m² et relève du permis de construire, alors que le garage seul
  serait resté en déclaration préalable.</desc>

  <defs>
    <pattern id="h2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#128A5A" stroke-width="1.6" opacity=".55"/>
    </pattern>
    <marker id="fl2" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M1 1 L8 4.5 L1 8 z" fill="#55617A"/>
    </marker>
  </defs>

  <rect width="840" height="460" fill="#FBFCFD"/>
  <g stroke="#C9D3DD" stroke-width=".5" opacity=".55">
    <path d="M40 0V460M120 0V460M200 0V460M280 0V460M360 0V460M440 0V460M520 0V460M600 0V460M680 0V460M760 0V460"/>
    <path d="M0 40H840M0 120H840M0 200H840M0 280H840M0 360H840M0 440H840"/>
  </g>

  <text x="40" y="44" fill="#14233B" font-size="19" font-weight="600">Garage de 19 m² prolongé d'un auvent sur poteaux</text>
  <text x="40" y="68" fill="#55617A" font-size="14">Vue de dessus · échelle 1 m = 46 px</text>

  <!-- garage fermé -->
  <rect x="110" y="140" width="230" height="176" rx="4" fill="url(#h2)" stroke="#128A5A" stroke-width="2.5"/>
  <rect x="110" y="140" width="230" height="176" rx="4" fill="#E4F5EC" opacity=".45"/>
  <text x="225" y="212" text-anchor="middle" fill="#0E6E48" font-size="17" font-weight="600">Garage fermé</text>
  <text x="225" y="236" text-anchor="middle" fill="#0E6E48" font-size="15">5,00 × 3,80 = 19 m²</text>
  <text x="225" y="260" text-anchor="middle" fill="#0E6E48" font-size="13">emprise au sol</text>

  <!-- auvent sur poteaux : dalle comptée. Largeur à l'échelle : 1,05 m = 48 px. -->
  <rect x="340" y="140" width="48" height="176" rx="4" fill="url(#h2)" stroke="#128A5A" stroke-width="2.5" stroke-dasharray="9 5"/>
  <rect x="340" y="140" width="48" height="176" rx="4" fill="#E4F5EC" opacity=".3"/>
  <g fill="#14233B">
    <circle cx="382" cy="146" r="5"/><circle cx="382" cy="310" r="5"/>
  </g>
  <!-- Légende de l'auvent posée à l'extérieur : la bande ne fait que 48 px de
       large à l'échelle, aucun texte n'y tiendrait. -->
  <path d="M364 140V104H452" stroke="#128A5A" stroke-width="1.4" fill="none"/>
  <text x="460" y="98" fill="#0E6E48" font-size="14" font-weight="600">Auvent sur poteaux — 4 m²</text>
  <text x="460" y="118" fill="#55617A" font-size="12.5">soutenu, donc compté dans l'emprise</text>

  <g stroke="#55617A" stroke-width="1.2" marker-start="url(#fl2)" marker-end="url(#fl2)">
    <path d="M110 342H340"/><path d="M340 342H388"/>
  </g>
  <text x="225" y="362" text-anchor="middle" fill="#55617A" font-size="13" font-family="IBM Plex Mono, monospace">5,00 m</text>
  <text x="364" y="380" text-anchor="middle" fill="#55617A" font-size="13" font-family="IBM Plex Mono, monospace">1,05 m</text>

  <!-- contre-exemple : débord de toiture non soutenu -->
  <g transform="translate(560,170)">
    <rect x="0" y="0" width="170" height="120" rx="4" fill="#FBFCFD" stroke="#9FADBC" stroke-width="1.5"/>
    <rect x="-16" y="-16" width="202" height="152" rx="6" fill="none" stroke="#9FADBC" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="85" y="56" text-anchor="middle" fill="#55617A" font-size="13">Débord de toiture</text>
    <text x="85" y="76" text-anchor="middle" fill="#55617A" font-size="13">sans poteau</text>
    <text x="85" y="164" text-anchor="middle" fill="#55617A" font-size="12.5">exclu de l'emprise</text>
    <text x="85" y="184" text-anchor="middle" fill="#55617A" font-size="12.5">(art. R.420-1)</text>
  </g>

  <g transform="translate(80,398)" font-size="13">
    <rect x="0" y="-11" width="18" height="14" rx="2" fill="#E4F5EC" stroke="#128A5A" stroke-width="2"/>
    <text x="26" y="0" fill="#14233B">Compté dans l'emprise au sol</text>
    <rect x="270" y="-11" width="18" height="14" rx="2" fill="#FBFCFD" stroke="#9FADBC" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="296" y="0" fill="#14233B">Exclu de l'emprise</text>
  </g>
  <text x="80" y="434" fill="#0E6E48" font-size="14" font-weight="600">19 + 4 = 23 m² d'emprise → permis de construire</text>
</svg>
