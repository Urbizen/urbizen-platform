<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" role="img"
     aria-labelledby="t3 d3" font-family="IBM Plex Sans, system-ui, sans-serif">
  <title id="t3">Carport double de 30 m² devant une maison de 140 m² de surface de plancher</title>
  <desc id="d3">Le carport crée 30 m² d'emprise au sol et aucune surface de plancher, faute
  d'être clos. L'emprise dépasse 20 m², ce qui impose un permis de construire. La surface de
  plancher totale reste à 140 m², sous le seuil de 150 m² : l'architecte n'est pas obligatoire.
  Les deux surfaces ne se lisent pas ensemble.</desc>

  <defs>
    <pattern id="h3" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#128A5A" stroke-width="1.6" opacity=".55"/>
    </pattern>
  </defs>

  <rect width="840" height="460" fill="#FBFCFD"/>
  <g stroke="#C9D3DD" stroke-width=".5" opacity=".55">
    <path d="M40 0V460M120 0V460M200 0V460M280 0V460M360 0V460M440 0V460M520 0V460M600 0V460M680 0V460M760 0V460"/>
    <path d="M0 40H840M0 120H840M0 200H840M0 280H840M0 360H840M0 440H840"/>
  </g>

  <text x="40" y="44" fill="#14233B" font-size="19" font-weight="600">Carport double devant une maison de 140 m²</text>
  <text x="40" y="68" fill="#55617A" font-size="14">Les deux surfaces ne se lisent pas ensemble</text>

  <!-- maison -->
  <rect x="80" y="120" width="260" height="200" rx="4" fill="#FBFCFD" stroke="#14233B" stroke-width="2.5"/>
  <text x="210" y="200" text-anchor="middle" fill="#14233B" font-size="17" font-weight="600">Maison existante</text>
  <text x="210" y="228" text-anchor="middle" fill="#14233B" font-size="15">140 m² de surface</text>
  <text x="210" y="250" text-anchor="middle" fill="#14233B" font-size="15">de plancher</text>

  <!-- carport -->
  <rect x="360" y="120" width="210" height="200" rx="4" fill="url(#h3)" stroke="#128A5A" stroke-width="2.5" stroke-dasharray="9 5"/>
  <rect x="360" y="120" width="210" height="200" rx="4" fill="#E4F5EC" opacity=".35"/>
  <text x="465" y="196" text-anchor="middle" fill="#0E6E48" font-size="17" font-weight="600">Carport double</text>
  <text x="465" y="222" text-anchor="middle" fill="#0E6E48" font-size="15">30 m² d'emprise</text>
  <text x="465" y="246" text-anchor="middle" fill="#0E6E48" font-size="15">0 m² de plancher</text>
  <g fill="#14233B">
    <circle cx="366" cy="126" r="5"/><circle cx="564" cy="126" r="5"/>
    <circle cx="366" cy="314" r="5"/><circle cx="564" cy="314" r="5"/>
  </g>
  <text x="465" y="272" text-anchor="middle" fill="#55617A" font-size="12.5">ouvert sur ses quatre côtés</text>

  <!-- les deux compteurs -->
  <g transform="translate(608,120)">
    <rect x="0" y="0" width="196" height="88" rx="8" fill="#E4F5EC" stroke="#128A5A" stroke-width="2"/>
    <text x="98" y="28" text-anchor="middle" fill="#0E6E48" font-size="12" letter-spacing=".8">EMPRISE AU SOL</text>
    <text x="98" y="58" text-anchor="middle" fill="#0E6E48" font-size="21" font-weight="600">30 m²</text>
    <text x="98" y="78" text-anchor="middle" fill="#0E6E48" font-size="12">&gt; 20 m² → permis</text>

    <rect x="0" y="108" width="196" height="88" rx="8" fill="#EAEEF2" stroke="#9FADBC" stroke-width="1.5"/>
    <text x="98" y="136" text-anchor="middle" fill="#55617A" font-size="12" letter-spacing=".8">SURFACE DE PLANCHER</text>
    <text x="98" y="166" text-anchor="middle" fill="#14233B" font-size="21" font-weight="600">140 m²</text>
    <text x="98" y="186" text-anchor="middle" fill="#55617A" font-size="12">&lt; 150 m² → pas d'architecte</text>
  </g>

  <g transform="translate(80,392)" font-size="13">
    <rect x="0" y="-11" width="18" height="14" rx="2" fill="#E4F5EC" stroke="#128A5A" stroke-width="2"/>
    <text x="26" y="0" fill="#14233B">Crée de l'emprise au sol</text>
    <rect x="250" y="-11" width="18" height="14" rx="2" fill="#FBFCFD" stroke="#14233B" stroke-width="2"/>
    <text x="276" y="0" fill="#14233B">Existant, non modifié</text>
  </g>
  <text x="80" y="430" fill="#0E6E48" font-size="14" font-weight="600">Permis de construire exigé, sans recours obligatoire à un architecte</text>
</svg>
