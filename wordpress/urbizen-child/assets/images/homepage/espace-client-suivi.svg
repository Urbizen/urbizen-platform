<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Tableau de suivi de l’espace client Urbizen</title>
  <desc id="desc">Interface montrant l’avancement du dossier, les documents transmis et les échanges avec Urbizen.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#E9EDF1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="760" height="560" fill="#FBFCFD"/>
  <rect x="26" y="24" width="708" height="512" rx="10" fill="#FFFFFF" stroke="#C9D3DD" stroke-width="2"/>
  <rect x="27" y="25" width="706" height="74" rx="9" fill="#14233B"/>
  <path d="M27 90V34a9 9 0 0 1 9-9h688a9 9 0 0 1 9 9v56" fill="#14233B"/>

  <g transform="translate(54 48)">
    <path d="M0 17 17 2l17 15v21H0z" fill="none" stroke="#54CF99" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M12 38V24h10v14" fill="none" stroke="#54CF99" stroke-width="2.4"/>
  </g>
  <text x="106" y="60" fill="#FFFFFF" font-family="Space Grotesk, Arial, sans-serif" font-size="20" font-weight="600">MON ESPACE CLIENT</text>
  <text x="106" y="82" fill="#CFE8DD" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.4">SUIVI DE MON PROJET</text>
  <circle cx="686" cy="61" r="18" fill="#E4F5EC"/>
  <path d="M679 66c1.4-5 12.6-5 14 0M686 51a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z" fill="none" stroke="#128A5A" stroke-width="1.8" stroke-linecap="round"/>

  <rect x="48" y="120" width="664" height="104" rx="8" fill="url(#grid)" stroke="#C9D3DD"/>
  <text x="70" y="149" fill="#128A5A" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.5">AVANCEMENT DU DOSSIER</text>
  <text x="70" y="179" fill="#14233B" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="600">Dossier en préparation</text>
  <rect x="70" y="194" width="520" height="8" rx="4" fill="#E5EAF0"/>
  <rect x="70" y="194" width="338" height="8" rx="4" fill="#128A5A"/>
  <text x="624" y="202" fill="#14233B" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600">65 %</text>

  <g font-family="IBM Plex Mono, monospace" font-size="10" letter-spacing=".6">
    <circle cx="84" cy="253" r="12" fill="#128A5A"/>
    <path d="m78 253 4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="257" fill="#55617A">DEMANDE REÇUE</text>

    <circle cx="269" cy="253" r="12" fill="#128A5A"/>
    <path d="m263 253 4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="289" y="257" fill="#55617A">PIÈCES VÉRIFIÉES</text>

    <circle cx="471" cy="253" r="12" fill="#14233B"/>
    <circle cx="471" cy="253" r="4" fill="#54CF99"/>
    <text x="491" y="257" fill="#14233B" font-weight="600">EN PRÉPARATION</text>
  </g>

  <rect x="48" y="288" width="320" height="220" rx="8" fill="#FFFFFF" stroke="#C9D3DD"/>
  <text x="70" y="320" fill="#128A5A" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.4">MES DOCUMENTS</text>
  <g font-family="IBM Plex Sans, Arial, sans-serif" font-size="14">
    <rect x="70" y="340" width="276" height="44" rx="5" fill="#FBFCFD" stroke="#E5EAF0"/>
    <path d="M88 351h15l8 8v15H88zM103 351v8h8" fill="none" stroke="#128A5A" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="126" y="367" fill="#14233B">Photos du projet</text>
    <text x="316" y="367" text-anchor="end" fill="#128A5A" font-size="12">Reçu</text>

    <rect x="70" y="394" width="276" height="44" rx="5" fill="#FBFCFD" stroke="#E5EAF0"/>
    <path d="M88 405h15l8 8v15H88zM103 405v8h8" fill="none" stroke="#128A5A" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="126" y="421" fill="#14233B">Plan existant</text>
    <text x="316" y="421" text-anchor="end" fill="#128A5A" font-size="12">Reçu</text>

    <rect x="70" y="448" width="276" height="38" rx="5" fill="#E4F5EC"/>
    <path d="M90 467h16M98 459v16" stroke="#128A5A" stroke-width="1.8" stroke-linecap="round"/>
    <text x="126" y="472" fill="#0E6E48" font-weight="600">Ajouter un document</text>
  </g>

  <rect x="388" y="288" width="324" height="220" rx="8" fill="#FFFFFF" stroke="#C9D3DD"/>
  <text x="410" y="320" fill="#128A5A" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.4">MES ÉCHANGES</text>
  <rect x="410" y="340" width="280" height="78" rx="7" fill="#E4F5EC"/>
  <circle cx="433" cy="365" r="12" fill="#128A5A"/>
  <path d="M428 365h10M433 360v10" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <text x="454" y="362" fill="#0E6E48" font-family="Space Grotesk, Arial, sans-serif" font-size="14" font-weight="600">Urbizen</text>
  <text x="454" y="384" fill="#55617A" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13">Les pièces ont bien été reçues.</text>
  <text x="454" y="403" fill="#55617A" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13">La préparation de votre dossier commence.</text>
  <rect x="410" y="436" width="280" height="50" rx="7" fill="#FBFCFD" stroke="#E5EAF0"/>
  <text x="426" y="466" fill="#8791A6" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13">Écrire un message…</text>
  <path d="m665 451 14 10-14 10 3-8h-12v-4h12z" fill="#128A5A"/>
</svg>
